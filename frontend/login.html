
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Mindfuel</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

  <div class="glass-box p-4" style="width: 22rem;">
    <h3 class="mb-3 text-center">Login to Mindfuel</h3>
    <form id="loginForm">
      <input type="email" class="form-control mb-2" placeholder="Email" id="email" required>
      <input type="password" class="form-control mb-3" placeholder="Password" id="password" required>
      <button type="submit" id="loginBtn" class="btn btn-primary w-100">Login</button>
    </form>
    <div class="mt-3 text-center">
      Don't have an account? <a href="signup.html">Signup</a>
    </div>
  </div>

  <script>
    // Login form submit event
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('http://localhost:3000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.token); // token save
          localStorage.setItem('user', JSON.stringify(data.user)); // user data store
          alert('Login successful!');
          window.location.href = 'greeting.html'; // next page
        } else {
          alert('please!signup first'); // error
        }
      } catch (err) {
        alert("Something went wrong. Please try again.");
      }
    });
  </script>
</body>
</html>
