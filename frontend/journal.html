<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Journal & Goals</title>

  <!-- Fonts + Bootstrap + Custom CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- <div id="navbar-container"></div> -->
  <!-- Glass effect background aur center card -->
  <div class="background-overlay">
    <div class="glass-card p-5" style="max-width:600px; margin:auto;">
      <h2 class="mb-4 text-center">Your Journal & Goals</h2>

      <!-- Goal Input -->
      <div class="mb-3">
        <label for="goalInput" class="form-label">Today's Goal:</label>
        <input type="text" id="goalInput" class="form-control glass-input" placeholder="Set your goal..." />
      </div>

      <!-- Journal Textarea -->
      <div class="mb-3">
        <label for="journalInput" class="form-label">Daily Reflection:</label>
        <textarea id="journalInput" rows="5" class="form-control glass-input" placeholder="Write your thoughts..."></textarea>
      </div>

      <!-- Save Button -->
      <button onclick="saveEntry()" class="btn glass-btn w-100 mb-3">Save Entry</button>

      <!-- Back to start or reset -->
      <button onclick="resetAll()" class="btn glass-btn w-100">Restart Journey</button>
    </div>
  </div>

  <script>
    
  // Agar token nahi mila, to login page pe redirect kar do
  const token = localStorage.getItem('token');
  if (!token) {
    alert('Please login first');
    window.location.href = 'login.html';
  }

    // Load existing entries array (agar pehle se hai)
    let entries = JSON.parse(localStorage.getItem("mindfuelEntries") || "[]");

    function saveEntry() {
      const goal = document.getElementById("goalInput").value.trim();
      const note = document.getElementById("journalInput").value.trim();

      // Simple validation
      if (!goal && !note) {
        alert("Kuch to likho ya goal set karo!");
        return;
      }

      // Entry object with timestamp
      const entry = {
        date: new Date().toLocaleString(), // date-time store
        goal,
        note
      };

      entries.push(entry);
      localStorage.setItem("mindfuelEntries", JSON.stringify(entries)); // save kar diya

      // Feedback to user
      alert("Great! Your entry is saved.");

      // Clear fields for next entry
      document.getElementById("goalInput").value = "";
      document.getElementById("journalInput").value = "";
    }

    function resetAll() {
      // Sare data clear karke wapas index pe bhej do
      localStorage.clear();
      window.location.href = "index.html";
    }


    fetch('navbar.html')
    .then(res=>res.text())
    .then(data=>{
      document.getElementById('navbar-container').innerHTML =data;
    });
  </script>

</body>
</html>
