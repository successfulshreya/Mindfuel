 <!-- signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup - Mindfuel</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card p-4 shadow" style="width: 22rem;">
    <h3 class="mb-3 text-center">Signup</h3>
    <form id="signupForm" action="http://localhost:3000/Signup" method="POST">
      <input type="text" class="form-control mb-2" placeholder="Name" id="name" required>
      <input type="email" class="form-control mb-2" placeholder="Email" id="email" required>
      <input type="password" class="form-control mb-3" placeholder="Password" id="password" required>
      <button type="submit" class="btn btn-primary w-100">Signup</button>
    </form>
    <div class="mt-3 text-center">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
      e.preventDefault();
  
      // Form values uthaye
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
  
      try {
        // Backend ko data bheja
        const res = await fetch('http://localhost:3000/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' ,
        },
          body: JSON.stringify({ name, email, password })
        });
  
        const data = await res.json();
  
        if (res.ok) {
          alert("Signup successful!");
          window.location.href = 'login.html'; // Redirect after signup
        } else {
          alert(data.error || "Signup failed!");
        }
      } catch (err) {
        console.error(err);
        alert("Server error!");
      }
    });
  </script>
  
  
</body>
</html>
