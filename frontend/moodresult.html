<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Mood Result</title>

  <!-- Fonts + Bootstrap + CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="d-flex justify-content-between align-items-center px-4 py-2 bg-dark text-white" style="position: fixed; top: 0; width: 100%; z-index: 1000;">
    <div class="fw-bold">Mindfuel</div>
    <div>
      <a href="index.html" class="text-white mx-2 text-decoration-none">Home</a>
      <a href="journal.html" class="text-white mx-2 text-decoration-none">Journal</a>
      <button onclick="logout()" class="btn btn-outline-light btn-sm">Logout</button>
    </div>
  </div>
  <div class="background-overlay">
    <div class="glass-card text-center p-5">
      <h2 class="mb-3">Your Mood Today:</h2>
      <div id="moodDisplay" class="mb-3 fs-1"></div>

      <h5 class="mb-2">Here's something for you:</h5>
      <blockquote id="quoteText" class="fst-italic">Loading...</blockquote>

      <a href="journal.html" class="btn mt-4 glass-btn">Continue to Journal</a>
    </div>
  </div>

  <script>
    // Get mood data from localStorage
    const moodLabel = localStorage.getItem("moodLabel");
    const moodMessage = localStorage.getItem("moodMessage");

    document.getElementById("moodDisplay").innerText = moodLabel
      ? moodLabel.toUpperCase()
      : "Unknown Mood";

    document.getElementById("quoteText").innerText = moodMessage
      ? moodMessage
      : "No quote available.";

    function logout() {
      localStorage.clear();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
