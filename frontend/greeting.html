<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hello from Mindfuel</title>

  <!-- Font + Bootstrap + CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="navbar-container"></div>
  <!-- Glass effect background -->
  <div class="background-overlay">
    <div class="glass-card text-center p-5">
      <!-- User ka naam yahan show hoga -->
      <h2 class="mb-3">Hey <span id="user-name" class="brand"></span>!</h2>
      <p class="mb-4">Welcome back to <strong>Mindfuel</strong></p>

      <!-- Continue button to mood page -->
      <a href="mood.html" class="btn glass-btn">Let's Check Your Mood</a>
    </div>
  </div>

  <script>
    // Naam fetch karna localStorage se aur show karna
    const user = localStorage.getItem("username");
    if (user) {
      document.getElementById("user-name").textContent = user;
    } else {
      // Agar user naam nahi mila toh wapas index pe bhej do
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
